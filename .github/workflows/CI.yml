name: CI Pipeline

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

jobs:
  # ===================================================================
  # Job 1: compile and Unit Test
  # ===================================================================
  unit-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: 'host=localhost user=postgres dbname=postgres port=5432 sslmode=disable TimeZone=Asia/Taipei'
      RABBITMQ_URL: 'amqp://guest:guest@localhost:5672/'

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Build Go application
        run: make build

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-app-executable
          path: ./bin/app

      - name: Run Database Migration
        run: go run dtm.go migrate -u migrate postgres database

      - name: Run Unit Tests
        run: go test -v ./...

  # ===================================================================
  # Job 2: (E2E Test)
  # ===================================================================
  e2e-test:
    # Fork pull requests cannot access repository secrets.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: unit-test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        start_command:
          - 'serve --dev=true --mq=go_chan'
          - 'serve --dev=true --mq=rabbitmq'
          - 'serve --dev=false --mq=go_chan'
          - 'serve --dev=false --mq=rabbitmq'

    env:
      DATABASE_URL: 'host=localhost user=postgres dbname=postgres port=5432 sslmode=disable TimeZone=Asia/Taipei'
      RABBITMQ_URL: 'amqp://guest:guest@localhost:5672/'
      # Password E2E does not visit the frontend; non-dev requires an HTTPS origin.
      FRONTEND_URL: 'https://frontend.example'
      OAUTH_REDIRECT_PATH: '/backend/auth/callback'
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GCIP_API_KEY: ${{ secrets.GCIP_API_KEY }}
      GCIP_PROJECT_ID: ${{ secrets.GCIP_PROJECT_ID }}
      E2E_AUTH_ENABLED: 'true'
      E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
      E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      rabbitmq:
        image: rabbitmq:3
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download executable artifact
        uses: actions/download-artifact@v4
        with:
          name: my-app-executable

      # - name: Display structure of downloaded files
      #   run: ls -R

      - name: Make executable
        run: chmod +x ./app

      - name: Run Database Migration
        run: go run dtm.go migrate -u migrate postgres database

      - name: Install Node.js dependencies
        run: cd e2e && yarn

      - name: Run Go application in background
        env:
          START_COMMAND: ${{ matrix.start_command }}
        run: |
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GCIP_API_KEY GCIP_PROJECT_ID E2E_AUTH_EMAIL E2E_AUTH_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done
          read -r -a args <<< "$START_COMMAND"
          ./app "${args[@]}" > /tmp/dtm-e2e-server.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Service did not become ready; check authentication configuration and dependencies.'
          exit 1

      - name: Run E2E tests
        run: make testE2E
